name: Independent plugin builds
on:
  push:
    paths:
      - 'plugins/**'
      - 'Dockerfile'
      - '.github/workflows/plugin-builds.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'Dockerfile'
      - '.github/workflows/plugin-builds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [deltaops, raid]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build independently twice and compare hashes
        run: docker build --platform=linux/amd64 -f Dockerfile --target "${{ matrix.plugin }}-artifacts" --output "type=local,dest=${{ runner.temp }}/${{ matrix.plugin }}-artifacts" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.plugin }}
          path: ${{ runner.temp }}/${{ matrix.plugin }}-artifacts/
